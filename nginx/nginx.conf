worker_processes 3;

events {
  worker_connections 1024;
}

http {
  include mime.types;
    
  upstream learningservice {
    server learningservice:8080;
  }

  upstream teachingservice {
    server teachingservice:8080;
  }

  server {
    listen 80;
    server_name localhost;

    location /api/v1/learning {
      proxy_pass http://learningservice;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/teaching {
      proxy_pass http://teachingservice;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}