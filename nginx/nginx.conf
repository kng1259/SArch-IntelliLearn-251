env OIDC_JWKS_URI;
env OIDC_CLIENT_ID;
env OIDC_SSL_VERIFY;

worker_processes 3;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=30s ipv6=off;
  lua_package_path "/usr/local/openresty/lualib/app/?.lua;/usr/local/openresty/lualib/?.lua;;";

  lua_shared_dict oidc_cache 10m;
  lua_shared_dict jwks_cache 10m;

  include mime.types;
    
  upstream learningservice {
    server learningservice:8080;
  }

  upstream teachingservice {
    server teachingservice:8080;
  }

  server {
    listen 80;
    server_name localhost;

    location /learning/ {
      # Handle CORS preflight requests
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }
      
      access_by_lua_file /usr/local/openresty/lualib/app/validate_oidc.lua;
      proxy_pass http://learningservice/api/v1/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Add CORS headers to response
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    location /teaching/ {
      # Handle CORS preflight requests
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }
      
      access_by_lua_file /usr/local/openresty/lualib/app/validate_oidc.lua;
      proxy_pass http://teachingservice/api/v1/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Add CORS headers to response
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
  }
}