services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: its
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d its"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - main_network

  learningservice:
    build:
      context: learningservice
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=its
      - DATABASE_USERNAME=admin
      - DATABASE_PASSWORD=admin
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=intellilearn
      - KEYCLOAK_CLIENT_ID=nginx
      - KEYCLOAK_CLIENT_SECRET=w5upehqrRr3xTL57IRAX0Vn5U6zGitbr
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/api/v1/actuator/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - main_network

  teachingservice:
    build:
      context: teachingservice
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=its
      - DATABASE_USERNAME=admin
      - DATABASE_PASSWORD=admin
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=intellilearn
      - KEYCLOAK_CLIENT_ID=nginx
      - KEYCLOAK_CLIENT_SECRET=w5upehqrRr3xTL57IRAX0Vn5U6zGitbr
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=iamadmin
      - MINIO_BUCKET_NAME=its
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/api/v1/actuator/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - main_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "127.0.0.1:8083:8080"
      - "9002:9000"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'true'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
    command: start-dev --import-realm
    volumes:
      - ./keycloak/intellilearn-realm.json:/opt/keycloak/data/import/intellilearn-realm.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - main_network

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: iamadmin
    entrypoint: sh
    command: -c 'mkdir -p /data/its && minio server --address ":9000" --console-address ":9001" /data'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - main_network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 admin iamadmin;
      mc anonymous set download myminio/its;
      echo 'Bucket policy set successfully';
      exit 0;
      "
    networks:
      - main_network

  web-app:
    build:
      context: web-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/teaching
      - NEXT_PUBLIC_KEYCLOAK_URL=http://localhost:8083
      - NEXT_PUBLIC_KEYCLOAK_REALM=intellilearn
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - main_network

  nginx:
    build:
      context: nginx
    ports:
      - "8080:80"
    environment:
      OIDC_JWKS_URI: "http://keycloak:8080/realms/intellilearn/protocol/openid-connect/certs"
      OIDC_CLIENT_ID: "nginx"
      OIDC_SSL_VERIFY: "no"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua:/usr/local/openresty/lualib/app:ro 
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      learningservice:
        condition: service_healthy
      teachingservice:
        condition: service_healthy
    networks:
      - main_network

volumes:
  postgres_data:
  minio_data:

networks:
  main_network:
